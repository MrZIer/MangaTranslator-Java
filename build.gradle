plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.10'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Manga Translation Tool with Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	
	// Async support
	implementation 'org.springframework.boot:spring-boot-starter'
	
	// MongoDB
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	
	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'redis.clients:jedis:5.1.0'
	
	// HTTP Client for calling external APIs
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	
	// File upload/download
	implementation 'commons-io:commons-io:2.15.1'
	implementation 'commons-codec:commons-codec:1.16.0'
	
	// JSON processing
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	
	// Lombok (optional, for reducing boilerplate)
	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	
	// PDF generation (optional)
	implementation 'com.itextpdf:itext7-core:8.0.2'
	
	// Image processing
	implementation 'org.imgscalr:imgscalr-lib:4.2'
	
	// Compression
	implementation 'org.apache.commons:commons-compress:1.25.0'
	
	// Scheduling
	implementation 'org.springframework.boot:spring-boot-starter-quartz'
	
	// Configuration processor
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	
	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:mongodb:1.19.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	// 添加DJL依赖用于OCR
	implementation 'ai.djl:api:0.25.0'
	implementation 'ai.djl.pytorch:pytorch-engine:0.25.0'
	implementation 'ai.djl.pytorch:pytorch-model-zoo:0.25.0'
	runtimeOnly 'ai.djl.pytorch:pytorch-native-cpu:2.1.1'
	
	// 如果有GPU
	// runtimeOnly 'ai.djl.pytorch:pytorch-native-cu118:2.1.1:linux-x86_64'
	
	// 添加Jep依赖
	implementation 'black.ninia:jep:4.1.1'
}

tasks.named('test') {
	useJUnitPlatform()
}
