<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫画快速翻译</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        
        #fileInput {
            display: none;
        }
        
        .file-list {
            margin: 20px 0;
        }
        
        .file-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        
        .translate-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px;
            font-size: 1.2em;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        .translate-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .progress {
            display: none;
            margin-top: 20px;
        }
        
        .results {
            display: none;
            margin-top: 30px;
        }
        
        .download-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 漫画翻译</h1>
        <p class="subtitle">日语→中文 自动翻译</p>
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 3em;">📁</div>
            <div>点击选择图片文件</div>
            <input type="file" id="fileInput" multiple accept="image/*">
        </div>
        
        <div class="file-list" id="fileList"></div>
        
        <button class="translate-btn" id="translateBtn" disabled>开始翻译</button>
        
        <div class="progress" id="progress">
            <div id="progressText">处理中...</div>
        </div>
        
        <div class="results" id="results"></div>
    </div>
    
    <script>
        let files = [];
        
        document.getElementById('fileInput').onchange = function(e) {
            files = Array.from(e.target.files);
            document.getElementById('fileList').innerHTML = files.map(f => 
                `<div class="file-item">${f.name}</div>`
            ).join('');
            document.getElementById('translateBtn').disabled = files.length === 0;
        };
        
        document.getElementById('translateBtn').onclick = async function() {
            const formData = new FormData();
            files.forEach(f => formData.append('files', f));
            
            document.getElementById('progress').style.display = 'block';
            this.disabled = true;
            
            try {
                const res = await fetch('/api/translate/images', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('results').style.display = 'block';
                    document.getElementById('results').innerHTML = `
                        <h3>✓ 翻译完成！</h3>
                        ${data.data.outputFiles.map(f => `
                            <button class="download-btn" onclick="location.href='/api/translate/download/${data.data.taskId}/${f}'">
                                下载 ${f}
                            </button>
                        `).join('')}
                    `;
                } else {
                    alert('翻译失败: ' + data.message);
                }
            } catch (e) {
                alert('错误: ' + e.message);
            } finally {
                this.disabled = false;
                document.getElementById('progress').style.display = 'none';
            }
        };
    </script>
</body>
</html>
