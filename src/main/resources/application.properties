# Application Configuration
spring.application.name=mangaTrans
server.port=8080

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/manga_translation
spring.data.mongodb.auto-index-creation=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=5000ms

# Async Configuration
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-task-

# File Storage Configuration
file.storage.base-path=./storage
file.storage.temp-retention-hours=24
file.storage.history-retention-days=30

# OCR Service Configuration
# 改为Java内置模式
ocr.service.mode=embedded
# ocr.service.url=http://localhost:5000  # 外部服务模式（已弃用）
ocr.service.timeout=30000
ocr.cache.ttl-hours=24
# manga_ocr模型路径配置
ocr.model.path=./models/manga_ocr
ocr.model.device=cpu
# 如果有GPU，可以改为：ocr.model.device=cuda

# Translation Service Configuration
translation.default-engine=zhipu
translation.cache.ttl-days=7

# 智谱清言 Configuration（新增）
translation.zhipu.api-key=af2e42eada4b428b952079ebfb4ba2a9.K2kNodV0dMq04rit
translation.zhipu.model=glm-4.5
translation.zhipu.base-url=https://open.bigmodel.cn/api/paas/v4

# OpenAI Configuration（保留作为备选）
translation.openai.api-key=${OPENAI_API_KEY:}
translation.openai.model=gpt-4o
translation.openai.base-url=https://api.openai.com/v1

# Claude Configuration（保留作为备选）
translation.claude.api-key=${CLAUDE_API_KEY:}
translation.claude.model=claude-3-5-sonnet-20241022
translation.claude.base-url=https://api.anthropic.com/v1

# DeepSeek Configuration（保留作为备选）
translation.deepseek.api-key=${DEEPSEEK_API_KEY:}
translation.deepseek.model=deepseek-chat
translation.deepseek.base-url=https://api.deepseek.com/v1

# Image Processing Configuration
image.max-width=2000
image.max-height=2000
image.output-format=png

# Watermark Configuration
watermark.enabled=true
watermark.text=AI Translated
watermark.opacity=0.3

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.mangaTrans=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Actuator (optional, for monitoring)
management.endpoints.web.exposure.include=health,info,metrics

